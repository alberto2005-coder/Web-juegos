<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 — Arcade Nova</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="top">
    <a class="back" href="../../index.html">← Arcade Nova</a>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box">Puntos<strong id="score">0</strong></div>
      <div class="score-box">Máximo<strong id="best">0</strong></div>
    </div>
  </header>

  <p class="hint">Usa las <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd> o desliza el dedo para mover las fichas</p>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="Tablero de 2048"></div>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card">
        <h2 id="overlay-title">¡Juego terminado!</h2>
        <p id="overlay-text"></p>
        <button id="play-again">Jugar otra vez</button>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="new-game">Nueva partida</button>
    <p class="meta">Autor: <a href="https://github.com/alberto2005-coder" target="_blank" rel="noopener noreferrer">Alberto Ortiz</a></p>
  </div>

  <script src="script.js"></script>
</body>

</html>
