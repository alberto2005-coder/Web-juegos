<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscaminas — Arcade Nova</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <div class="game">
    <header class="top">
      <a class="back" href="../../index.html"><i class="fa-solid fa-arrow-left"></i> Arcade Nova</a>
      <h1>💣 Buscaminas</h1>
      <button id="restart" class="btn"><i class="fa-solid fa-rotate-right"></i> Nuevo</button>
    </header>

    <div class="hud">
      <div class="hud-box"><i class="fa-solid fa-flag"></i> <strong id="mines-left">10</strong></div>
      <div class="hud-box face" id="face" title="Reiniciar">🙂</div>
      <div class="hud-box"><i class="fa-solid fa-clock"></i> <strong id="timer">0</strong></div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="Tablero de buscaminas"></div>
    </div>

    <p class="hint">Clic izquierdo: descubrir · Clic derecho: bandera 🚩 · En móvil: mantén pulsado</p>

    <p class="meta">Autor: <a href="https://github.com/alberto2005-coder" target="_blank" rel="noopener noreferrer">Alberto Ortiz</a></p>
  </div>

  <script src="script.js"></script>
</body>

</html>
