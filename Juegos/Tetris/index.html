<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris — Arcade Nova</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game">
        <header class="top">
            <a class="back" href="../../index.html">← Arcade Nova</a>
            <h1>Tetris — Arcade Nova</h1>
        </header>

        <div class="fondo">
            <div class="areaJuego" id="areaJuego">
                <div class="pantallaInicioDerrota" id="pantallaInicio">
                    <h2>Tetris</h2>
                    <p class="overlay-text">Encaja las piezas y completa líneas</p>
                    <button id="botonIniciar">Empezar</button>
                </div>
            </div>
        </div>

        <p class="hint">← → mover · ↑ girar · ↓ acelerar</p>
        <p class="meta">Autor: <a href="https://github.com/NekeritDevs/Web-juegos" target="_blank" rel="noopener noreferrer" title="Proyecto original: NekeritDevs/Web-juegos">Marcelo Ecuador</a></p>
    </div>

    <template id="plantillaJuego">
        
        <div class="juego" id="juego">
            <canvas id="tablero"></canvas>
            <div id="informacion">
                
                <div class="siguientePieza">
                    <h2>Siguiente pieza:</h2>
                    <canvas id="siguientePieza"></canvas>
                </div>                    
                <div>
                    <h2>Puntuación: <span id="puntuacion">0</span></h2>
                </div>
            
            </div>
        </div>

    </template>
    <template id="plantillaDerrota">
        
        <div class="pantallaInicioDerrota" id="derrota">
            <h2>Has perdido</h2>
            <p class="overlay-text">La próxima pieza puede ser la tuya</p>
            <button id="botonReiniciar">Reiniciar</button>
        </div>
        
    </template>

    <script src="script.js"></script>
</body>
</html>
