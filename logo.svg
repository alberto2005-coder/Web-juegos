<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Arcade Nova">
  <defs>
    <linearGradient id="an-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="an-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="an-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1020" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fondo con esquinas redondeadas -->
  <rect x="16" y="16" width="480" height="480" rx="118" ry="118" fill="url(#an-bg)" filter="url(#an-shadow)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" ry="118" fill="url(#an-shine)"/>
  <rect x="16" y="16" width="480" height="480" rx="118" ry="118" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Botón "play" -->
  <path d="M214 148
           q22 -14 40 6
           l118 100
           q16 14 0 28
           l-118 100
           q-18 20 -40 6
           q-14 -10 -14 -30
           v-180
           q0 -20 14 -30 z"
        fill="#ffffff" opacity="0.96"/>

  <!-- Estrella / destello superior -->
  <path d="M372 132
           q10 26 36 34
           q-26 8 -36 34
           q-10 -26 -36 -34
           q26 -8 36 -34 z"
        fill="#FDE047"/>
</svg>
