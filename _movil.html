<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test móvil — Arcade Nova</title>
  <style>
    html, body { margin: 0; background: #0b1020; font-family: system-ui, sans-serif; }
    #fila { display: flex; align-items: flex-start; }
    iframe { display: block; border: 0; width: 360px; background: #000; }
    #informe { display: none; }
  </style>
</head>
<body>
  <div id="fila"></div>
  <pre id="informe"></pre>
  <script>
    const params = new URLSearchParams(location.search);
    const rutas = (params.get("j") || "/").split(",");
    const alto = parseInt(params.get("h") || "740", 10);
    const fila = document.getElementById("fila");
    window.listo = false;

    const iframes = rutas.map((r) => {
      const f = document.createElement("iframe");
      f.style.height = alto + "px";
      f.src = r;
      f._info = null;
      f.addEventListener("load", () => {
        try {
          const d = f.contentDocument;
          const el = d.documentElement;
          const ancho = el.clientWidth;
          const desborde = el.scrollWidth - ancho;
          const culpables = [];
          if (desborde > 1) {
            [...d.body.querySelectorAll("*")].forEach((n) => {
              const rc = n.getBoundingClientRect();
              if (rc.right > ancho + 1 || rc.left < -1) {
                culpables.push(n.tagName + "." + String(n.className).split(" ")[0] + " → " + Math.round(rc.right));
              }
            });
          }
          const errs = [];
          try {
            f.contentWindow.addEventListener("error", (e) => errs.push(String(e.message || e)));
            f.contentWindow.addEventListener("unhandledrejection", (e) => errs.push("promise: " + String(e.reason)));
          } catch (_) {}
          f._info = { ruta: r, titulo: d.title, ancho: ancho, desbordePx: desborde, culpables: culpables.slice(0, 6), errores: errs };
        } catch (e) {
          f._info = { ruta: r, errorHarness: String(e) };
        }
        if (iframes.every((x) => x._info)) {
          window.listo = true;
          document.getElementById("informe").textContent = JSON.stringify(iframes.map((x) => x._info), null, 1);
        }
      });
      fila.appendChild(f);
      return f;
    });
  </script>
</body>
</html>
